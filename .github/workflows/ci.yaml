name: CI

on:
  push:
  pull_request:

jobs:
  # Backend
  backend-checks:
    name: Backend – ${{ matrix.theme }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        include:
          - theme: Linter
            command: flake8 . && uv run ruff check .
          - theme: TypeCheck
            command: mypy .
          - theme: Security
            command: bandit -r . --exclude ./.venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ${{ matrix.command }}

  # Machine learning
  ml-checks:
    name: ML Service – ${{ matrix.theme }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    strategy:
      matrix:
        include:
          - theme: Linter
            command: flake8 . && uv run ruff check .
          - theme: TypeCheck
            command: mypy .
          - theme: Security
            command: bandit -r . --exclude ./.venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ${{ matrix.command }}

  # Frontend
  frontend-checks:
    name: Frontend – ${{ matrix.theme }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      matrix:
        include:
          - theme: Linter (ESLint)
            command: pnpm run lint
          - theme: TypeCheck (TypeScript)
            command: npx tsc --noEmit
          - theme: Security
            command: pnpm run audit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
