name: Build and Push to GHCR

on:
  push:
    branches:
      - prod
      - preprod
    tags:
      - "v*"
  pull_request:
    branches:
      - prod

# Allow GHCR push
permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  build-and-push:
    name: Build, Scan and Push Docker Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker config for GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Docker meta for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preprod,enable=${{ github.ref == 'refs/heads/preprod' }}

      # Build backend image locally for scanning
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # Scan backend image before pushing
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Push backend image (blocking scan already passed)
      - name: Push backend image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag ghcr.io/${{ github.repository }}/backend:${{ github.sha }} "$tag"
            docker push "$tag"
          done

      # Docker meta for frontend
      - name: Docker meta for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preprod,enable=${{ github.ref == 'refs/heads/preprod' }}

      # Build frontend image locally for scanning
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      # Scan frontend image before pushing
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Push frontend image (blocking scan already passed)
      - name: Push frontend image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} "$tag"
            docker push "$tag"
          done

      # Docker meta for ml_service
      - name: Docker meta for ml_service
        id: meta-ml
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ml-service
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preprod,enable=${{ github.ref == 'refs/heads/preprod' }}

      # Build ml_service image locally for scanning
      - name: Build ml_service image
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/ml-service:${{ github.sha }}

      # Scan ml_service image before pushing
      - name: Scan ml_service image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/ml-service:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Push ml_service image (blocking scan already passed)
      - name: Push ml_service image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta-ml.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag ghcr.io/${{ github.repository }}/ml-service:${{ github.sha }} "$tag"
            docker push "$tag"
          done

      # Docker meta for proxy
      - name: Docker meta for proxy
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/proxy
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preprod,enable=${{ github.ref == 'refs/heads/preprod' }}

      # Build proxy image locally for scanning
      - name: Build proxy image
        uses: docker/build-push-action@v5
        with:
          context: ./proxy
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/proxy:${{ github.sha }}

      # Scan proxy image before pushing
      - name: Scan proxy image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/proxy:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Push proxy image (blocking scan already passed)
      - name: Push proxy image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta-proxy.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag ghcr.io/${{ github.repository }}/proxy:${{ github.sha }} "$tag"
            docker push "$tag"
          done

      # Create deployment on GitHub for tracability
      - name: Create GitHub Deployment
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: `Built, scanned and pushed images to GHCR: backend, frontend, ml-service, proxy (${{ github.sha }})`,
              transient_environment: false
            });

            // Mettre à jour le statut en success
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'production',
              environment_url: 'https://card-vault.franck-dev-hub.com',
              description: 'Images built, scanned and pushed to GHCR successfully'
            });
